services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic_app
    working_dir: /app
    ports:
      - "8888:8795"
    environment:
      GEOAI_DATA_ROOT: /app/data
      PYTHONPATH: /app/backend:/app
    volumes:
      - .:/app
    command: python -m uvicorn main:app --app-dir /app/backend --host 0.0.0.0 --port 8795
